name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: matrix.os == 'ubuntu-24.04'
        run: cargo fmt --check
      - run: cargo clippy -p cleaner-core -p cleaner-cli --all-targets -- -D warnings
      - run: cargo test -p cleaner-core -p cleaner-cli

  node-and-dsh-plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run check:versions
      - run: npm run typecheck
      - run: npm run build:plugins
      - run: npm --workspace=dsh-agent-cleaner test
      - run: npm --workspace=@agent-cleaner/desktop run build
