[package]
name = "cleaner-core"
version = "0.2.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
dirs = "6"
jsonc-parser = { version = "0.34", features = ["cst", "serde"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.13"
specta = { version = "2.0.0-rc.28", features = ["derive"] }
sysinfo = "0.35"
toml = "0.8"
toml_edit = "0.25"
uuid = { version = "1", features = ["v4", "v5"] }

[dev-dependencies]
tempfile = "3"
