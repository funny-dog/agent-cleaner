[package]
name = "cleaner-cli"
version = "0.2.3"
edition = "2021"
license = "MIT"

[[bin]]
name = "ac"
path = "src/bin/ac.rs"

[[bin]]
name = "agent-cleaner"
path = "src/bin/agent-cleaner.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cleaner-core = { path = "../cleaner-core" }
comfy-table = "7"
dialoguer = "0.11"
owo-colors = "4"
serde_json = "1"
